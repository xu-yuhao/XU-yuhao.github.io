# People page data (rendered by _pages/people.html).
# PI and student profiles follow the old Google Site; the other lists come from the CV dated 2026-09-23.
#
# photo:     file under assets/img/, e.g. people/jane_doe.jpg. Leave empty to show initials instead.
#            A square photo works best (it is cropped to a square).
# role:      shown after the name, e.g. Ph.D. Student
# bio:       one or more sentences
# interests: shown after "Current research interest:"
# info:      one short line, used by the lists (undergraduates and alumni)
# style: list   shows a group as a list (name and info, no photos) instead of profiles.
# style: names  shows only the names, on one line (info is kept in the file but not shown).
# note:         optional line in italics under the group heading.
# hide: true    on a person hides that person; on a group (next to "group:") hides the whole group.
#               Nothing is deleted, so removing the line brings it back.
# A group with no visible members is hidden automatically.
#
# Keep the double quotes around text that contains a colon, or that starts with "[" or "*".
# To add someone, copy the commented example lines under the right group, remove the "# " at the start
# of each line, and fill them in. Indentation must stay exactly as shown (spaces, not tabs).

